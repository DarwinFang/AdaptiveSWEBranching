include:
  - ../agent/qwen3_coder_30b_openhands.yaml
  - ../benchmark/swesmith_py.yaml
  - ../baselines/swe_replay.yaml

experiment:
  name: phase4_oracle_pilot_v1
  method_version: single_layer_shared_q_v1
  status: planned_not_launched
  output_dir: /home/fangzhaohao/asb-runs/phase4_oracle_pilot_v1
  root_seed: 20260901
  immutable_manifest_required: true

difficulty_screen:
  independent_from_label_rollouts: true
  reuse_screen_trajectories: false
  existing_run_dir: /home/fangzhaohao/recov-runs/oracle_branchability_root_screen_v1
  existing_manifest: /home/fangzhaohao/recov-runs/oracle_branchability_root_screen_v1/manifest.json
  existing_code_commit: a7d30e433fd372d2159cad3db08a5b56ebb6231b
  runs_per_task: 6
  medium_success_counts: [2, 3, 4]
  medium_q_range_inclusive: [0.2, 0.8]
  require_complete_screen_runs: true
  audit:
    screened_tasks: 40
    root_trajectories_present: 196
    tasks_with_all_6_runs: 28
    incomplete_tasks: 12
    eligible_medium_tasks: 5
    audited_at: "2026-09-01"
  eligible_task_ids:
    - PyCQA__flake8.cf1542ce.combine_file__a0r77ily
    - andialbrecht__sqlparse.e57923b3.func_basic__2z5qpz31
    - benoitc__gunicorn.bacbf8aa.lm_rewrite__qo8ncrou
    - borntyping__python-colorlog.dfa10f59.combine_file__zfevw67p
    - burnash__gspread.a8be3b96.func_pm_remove_wrapper__8fiiuog5
  pilot_minimum_tasks: 12
  pilot_target_tasks: 12
  pilot_maximum_tasks: 20
  action_if_below_minimum: extend_with_fresh_complete_root_runs
  launch_blocked_until_minimum: true

source_trajectory:
  fresh_runs_per_selected_task: 1
  reuse_difficulty_screen_runs: false
  termination: natural_or_safety_cap
  safety_cap_steps: 60

parent_candidates:
  requested_per_task: 4
  remove_initial_and_terminal_states: true
  nonterminal_only: true
  order_by: trajectory_absolute_step
  stratification: three_contiguous_relative_progress_chunks
  candidates:
    random:
      count: 3
      selection: stratified_uniform_without_replacement
      strata_by_eligible_checkpoint_rank:
        - early_third
        - middle_third
        - late_third
      candidate_sources: [random_early, random_middle, random_late]
    swe_replay:
      count: 1
      selector: faithful_critical_step_selector
      candidate_sources: [swe_replay]
  deduplicate_absolute_steps: true
  overlap_provenance: retain_both_sources_on_one_unique_parent
  duplicate_replacement:
    first: fixed_seed_random_from_overlapped_stratum
    fallback: fixed_seed_random_from_all_remaining_eligible_nonterminal
  required_unique_parents_per_task: 4

label_rollout:
  target_valid_continuations_per_parent: 8
  minimum_valid_continuations_for_formal_analysis: 6
  maximum_total_attempts_per_parent: 12
  invalid_retry_policy: retain_raw_and_retry_with_new_deterministic_seed
  retry_outcomes: [invalid]
  do_not_retry_outcomes: [solved, unsolved]
  continuation_k_is_variable_in_schema: true
  restore_exact_same_parent: true
  isolated_workspaces: true
  full_post_parent_trajectory_required: true
  save_executable_prefix_checkpoints_at_steps: [1, 2, 4, 6]
  termination: natural_or_safety_cap
  safety_cap_steps: 60
  nested_child_downstream_rollouts: false
  separate_no_branch_rollouts: false
  invalid_outcome_policy: retain_raw_exclude_from_valid_k
  acceptance:
    valid_8: accept_complete
    valid_6_or_7: accept_with_actual_k
    valid_below_6: retain_raw_exclude_from_formal_parent_analysis
  cap_hit:
    record_explicitly: true
    main_analysis_outcome: unsolved
    sensitivity_analysis: recompute_after_excluding_cap_hits
    review_cap_if_rate_exceeds: 0.05

shared_success_probability_model:
  output: q_state
  meaning: probability_of_eventual_success_under_frozen_agent_protocol
  training_objective: binomial_negative_log_likelihood
  evidence_weighting: one_unit_per_observed_bernoulli_future
  parent_examples:
    input: parent_executable_checkpoint
    successes: successful_valid_continuations
    trials: valid_continuations
  prefix_examples:
    input: saved_executable_prefix_checkpoint
    prefix_steps: [1, 2, 4, 6]
    successes: terminal_success_of_its_one_full_continuation
    trials: 1
  uses_cost_as_target: false
  pairwise_head: false
  separate_a_b_models: false

inference_roles:
  judger_a:
    input: parent_executable_checkpoint
    score: 4*q_parent*(1-q_parent)
  judger_b:
    input: each_generated_child_executable_checkpoint
    selection: argmax_q_child

oracle_analysis:
  judger_a_threshold_sweep: all_unique_observed_scores_plus_endpoints
  diagnostic_threshold: 0.75
  learned_threshold_selection_split: validation
  branch_selection_upper_bound: trajectory_outcome_oracle
  trajectory_outcome_oracle_is_clairvoyant: true
  trajectory_outcome_oracle_is_not_child_q_oracle: true

online_simulation:
  primary_branch_count: 4
  secondary_branch_count: 2
  prefix_steps: [1, 2, 4, 6]
  strategies:
    - single_chain
    - best_of_n
    - random_branching
    - faithful_swe_replay
    - oracle_a_trajectory_outcome_oracle
  compute:
    primary_axis: total_tokens
    secondary_axes: [model_calls, steps, wall_clock_seconds]
    normalized_budgets: [1.0, 1.5, 2.0, 4.0]
    reference_1x: one_ordinary_single_chain_protocol

planned_scale:
  at_12_tasks:
    source_trajectories: 12
    parent_checkpoints: 48
    target_valid_full_continuations: 384
    maximum_attempts_with_invalid_retries: 576
    grouped_parent_q_targets_max: 48
    prefix_bernoulli_q_targets_max_all_4_depths: 1536
    shared_q_targets_max_total: 1584
  at_20_tasks:
    source_trajectories: 20
    parent_checkpoints: 80
    target_valid_full_continuations: 640
    maximum_attempts_with_invalid_retries: 960
    grouped_parent_q_targets_max: 80
    prefix_bernoulli_q_targets_max_all_4_depths: 2560
    shared_q_targets_max_total: 2640

launch_gates:
  - at_least_12_independently_screened_medium_tasks
  - run_bounded_checkpoint_restore_and_verifier_smoke
  - create_immutable_resolved_manifest
